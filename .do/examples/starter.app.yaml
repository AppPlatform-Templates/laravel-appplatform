# Starter Mode - Laravel on App Platform
# Lower-cost configuration for development, testing, and small applications

name: laravel-starter-app
# Optionally you can chose a region where the deployment will be hosted
# Otherwise, DO will chose the nearest region for you in the wizard
# region: nyc

services:
  - name: web
    github:
      repo: AppPlatform-Templates/laravel-appplatform
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/web/Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xs  # Single instance, no auto-scaling
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_KEY
        value: <REQUIRED>
        type: SECRET
      - key: APP_NAME
        value: "Laravel Starter App"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "${APP_URL}"
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_HOST
        value: "${laravel-dev-db.HOSTNAME}"
      - key: DB_PORT
        value: "${laravel-dev-db.PORT}"
      - key: DB_DATABASE
        value: "${laravel-dev-db.DATABASE}"
      - key: DB_USERNAME
        value: "${laravel-dev-db.USERNAME}"
      - key: DB_PASSWORD
        value: "${laravel-dev-db.PASSWORD}"
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # Use database for cache and sessions (no Redis in starter mode)
      - key: CACHE_DRIVER
        value: "database"
      - key: SESSION_DRIVER
        value: "database"
      # Use sync queue (no queue worker in starter mode)
      - key: QUEUE_CONNECTION
        value: "sync"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: FILESYSTEM_DISK
        value: "local"

workers:
  # Optional: Include scheduler worker
  # Remove this section if you don't need scheduled tasks
  - name: scheduler
    github:
      repo: AppPlatform-Templates/laravel-appplatform
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/scheduler/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: APP_KEY
        value: <REQUIRED>
        type: SECRET
      - key: APP_ENV
        value: "production"
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_HOST
        value: "${laravel-dev-db.HOSTNAME}"
      - key: DB_PORT
        value: "${laravel-dev-db.PORT}"
      - key: DB_DATABASE
        value: "${laravel-dev-db.DATABASE}"
      - key: DB_USERNAME
        value: "${laravel-dev-db.USERNAME}"
      - key: DB_PASSWORD
        value: "${laravel-dev-db.PASSWORD}"
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: LOG_CHANNEL
        value: "stderr"

databases:
  # Dev Database - PostgreSQL only, 1GB storage, $7/month
  - engine: PG
    name: laravel-dev-db
    production: false  # Dev database
    version: "16"
