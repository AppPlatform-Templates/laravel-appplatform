# Starter Mode - Laravel on App Platform
# Lower-cost configuration for development, testing, and small applications
# Estimated cost: ~$22/month

spec:
  name: laravel-starter
  region: nyc3

  services:
    - name: web
      git:
        repo_clone_url: https://github.com/AppPlatform-Templates/laravel-appplatform.git
        branch: main
      dockerfile_path: docker/web/Dockerfile
      http_port: 80
      instance_count: 1
      instance_size_slug: basic-xs  # Single instance, no auto-scaling
      health_check:
        http_path: /
        initial_delay_seconds: 60
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
      envs:
        - key: APP_NAME
          value: "Laravel Starter"
        - key: APP_ENV
          value: "production"
        - key: APP_DEBUG
          value: "false"
        - key: APP_URL
          value: "${APP_URL}"
        - key: APP_KEY
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        - key: DB_CONNECTION
          value: "pgsql"
        - key: DB_HOST
          value: "${db.HOSTNAME}"
        - key: DB_PORT
          value: "${db.PORT}"
        - key: DB_DATABASE
          value: "${db.DATABASE}"
        - key: DB_USERNAME
          value: "${db.USERNAME}"
        - key: DB_PASSWORD
          value: "${db.PASSWORD}"
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        # Use database for cache and sessions (no Redis in starter mode)
        - key: CACHE_DRIVER
          value: "database"
        - key: SESSION_DRIVER
          value: "database"
        # Use sync queue (no queue worker in starter mode)
        - key: QUEUE_CONNECTION
          value: "sync"
        - key: LOG_CHANNEL
          value: "stderr"
        - key: FILESYSTEM_DISK
          value: "local"

  workers:
    # Optional: Include scheduler worker ($5/month)
    # Remove this section if you don't need scheduled tasks
    - name: scheduler
      git:
        repo_clone_url: https://github.com/AppPlatform-Templates/laravel-appplatform.git
        branch: main
      dockerfile_path: docker/scheduler/Dockerfile
      instance_count: 1
      instance_size_slug: basic-xxs
      envs:
        - key: APP_ENV
          value: "production"
        - key: APP_KEY
          scope: RUN_TIME
          type: SECRET
        - key: DB_CONNECTION
          value: "pgsql"
        - key: DB_HOST
          value: "${db.HOSTNAME}"
        - key: DB_PORT
          value: "${db.PORT}"
        - key: DB_DATABASE
          value: "${db.DATABASE}"
        - key: DB_USERNAME
          value: "${db.USERNAME}"
        - key: DB_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: "${db.PASSWORD}"
        - key: LOG_CHANNEL
          value: "stderr"

  databases:
    # Dev Database - PostgreSQL only, 1GB storage, $7/month
    - engine: PG
      name: db
      production: false  # Dev database
      version: "16"
