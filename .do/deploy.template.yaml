spec:
  name: laravel-app
  region: nyc3

  services:
    - name: web
      git:
        repo_clone_url: https://github.com/venkat-do/laravel-appplatform.git
        branch: main
      dockerfile_path: docker/web/Dockerfile
      http_port: 80
      instance_size_slug: professional-xs
      autoscaling:
        min_instance_count: 2
        max_instance_count: 10
        metrics:
          cpu:
            percent: 70
      health_check:
        http_path: /
        initial_delay_seconds: 60
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
      envs:
        - key: APP_NAME
          value: "Laravel on App Platform"
        - key: APP_ENV
          value: "production"
        - key: APP_DEBUG
          value: "false"
        - key: APP_URL
          value: "${APP_URL}"
        - key: APP_KEY
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        - key: DB_CONNECTION
          value: "pgsql"
        - key: DB_HOST
          value: "${db.HOSTNAME}"
        - key: DB_PORT
          value: "${db.PORT}"
        - key: DB_DATABASE
          value: "${db.DATABASE}"
        - key: DB_USERNAME
          value: "${db.USERNAME}"
        - key: DB_PASSWORD
          value: "${db.PASSWORD}"
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        - key: REDIS_HOST
          value: "${redis.HOSTNAME}"
        - key: REDIS_PORT
          value: "${redis.PORT}"
        - key: REDIS_PASSWORD
          value: "${redis.PASSWORD}"
          scope: RUN_AND_BUILD_TIME
          type: SECRET
        - key: CACHE_DRIVER
          value: "redis"
        - key: SESSION_DRIVER
          value: "redis"
        - key: QUEUE_CONNECTION
          value: "redis"
        - key: LOG_CHANNEL
          value: "stderr"
        - key: FILESYSTEM_DISK
          value: "local"

  workers:
    - name: queue-worker
      git:
        repo_clone_url: https://github.com/venkat-do/laravel-appplatform.git
        branch: main
      dockerfile_path: docker/queue-worker/Dockerfile
      instance_size_slug: professional-xs
      autoscaling:
        min_instance_count: 1
        max_instance_count: 5
        metrics:
          cpu:
            percent: 75
      envs:
        - key: APP_ENV
          value: "production"
        - key: APP_KEY
          scope: RUN_TIME
          type: SECRET
        - key: DB_CONNECTION
          value: "pgsql"
        - key: DB_HOST
          value: "${db.HOSTNAME}"
        - key: DB_PORT
          value: "${db.PORT}"
        - key: DB_DATABASE
          value: "${db.DATABASE}"
        - key: DB_USERNAME
          value: "${db.USERNAME}"
        - key: DB_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: "${db.PASSWORD}"
        - key: REDIS_HOST
          value: "${redis.HOSTNAME}"
        - key: REDIS_PORT
          value: "${redis.PORT}"
        - key: REDIS_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: "${redis.PASSWORD}"
        - key: QUEUE_CONNECTION
          value: "redis"
        - key: LOG_CHANNEL
          value: "stderr"

    - name: scheduler
      git:
        repo_clone_url: https://github.com/venkat-do/laravel-appplatform.git
        branch: main
      dockerfile_path: docker/scheduler/Dockerfile
      instance_count: 1
      instance_size_slug: basic-xxs
      envs:
        - key: APP_ENV
          value: "production"
        - key: APP_KEY
          scope: RUN_TIME
          type: SECRET
        - key: DB_CONNECTION
          value: "pgsql"
        - key: DB_HOST
          value: "${db.HOSTNAME}"
        - key: DB_PORT
          value: "${db.PORT}"
        - key: DB_DATABASE
          value: "${db.DATABASE}"
        - key: DB_USERNAME
          value: "${db.USERNAME}"
        - key: DB_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: "${db.PASSWORD}"
        - key: REDIS_HOST
          value: "${redis.HOSTNAME}"
        - key: REDIS_PORT
          value: "${redis.PORT}"
        - key: REDIS_PASSWORD
          scope: RUN_TIME
          type: SECRET
          value: "${redis.PASSWORD}"
        - key: LOG_CHANNEL
          value: "stderr"

  databases:
    - engine: PG
      name: db
      production: true
      version: "16"
    - engine: REDIS
      name: redis
      production: true
      version: "7"
